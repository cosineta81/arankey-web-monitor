name: ARANKEY availability
run-name: ${{ inputs.test_alert && 'TEST de aviso (sin caida de la web)' || 'Comprobacion de disponibilidad de ARANKEY' }}

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '43 3 * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Probar el aviso de fallo sin interrumpir la web'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: arankey-availability
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      report: ${{ steps.probe.outputs.report }}
    steps:
      - name: Download exact reviewed monitor revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --retry 2 --output check.mjs "https://raw.githubusercontent.com/$REPOSITORY/$REVISION/monitor/check.mjs"
      - name: Check homepage, service and live property API
        id: probe
        env:
          ARANKEY_TEST_ALERT: ${{ inputs.test_alert && 'true' || 'false' }}
        run: |
          set +e
          node check.mjs > report.json
          result=$?
          cat report.json
          node --input-type=module -e 'import fs from "node:fs"; const report=JSON.parse(fs.readFileSync("report.json","utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT,"report="+JSON.stringify(report)+"\n");'
          exit "$result"

  daily-history:
    if: ${{ always() && github.event.schedule == '43 3 * * *' }}
    needs: monitor
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Download exact history writer revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --retry 2 --output history.mjs "https://raw.githubusercontent.com/$REPOSITORY/$REVISION/monitor/history.mjs"
      - name: Keep a genuine daily availability sample
        env:
          REPORT_JSON: ${{ needs.monitor.outputs.report }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node history.mjs
